services:
  archaeo:
    build: .
    image: archaeo-layer-records:latest
    container_name: archaeo-layer-records
    ports:
      - "8000:8000"
    environment:
      # 首次启动且数据库为空时写入演示数据（探方 T01/T02，含冲突草稿示例）
      SEED_DEMO: "1"
      DATABASE_PATH: /data/archaeo.db
      GUNICORN_WORKERS: "2"
    volumes:
      - archaeo-data:/data
    restart: unless-stopped

volumes:
  archaeo-data:
